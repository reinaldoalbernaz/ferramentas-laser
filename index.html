<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulação de Altura Focal - Corte Laser em MDF</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #ffffff;
      --accent-color: #00d2d3;
      --laser-red: #ff0055;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-color);
      color: var(--text-color);
    }

    body {
      display: flex;
      flex-direction: column;
      padding: 15px 20px;
      gap: 10px;
    }

    header {
      text-align: center;
      flex-shrink: 0;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 4px;
    }

    p.description {
      color: #aaa;
      font-size: 0.85rem;
      max-width: 900px;
      margin: 0 auto;
    }

    .main-container {
      display: flex;
      flex: 1;
      gap: 20px;
      width: 100%;
      min-height: 0;
      /* Permite redução dentro do flexbox */
      justify-content: center;
    }

    .canvas-container {
      flex: 1;
      background-color: #080808;
      border-radius: 8px;
      border: 1px solid #333;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 0;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .controls {
      background-color: var(--card-bg);
      padding: 18px;
      border-radius: 8px;
      width: 320px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      overflow-y: auto;
      max-height: 100%;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    label {
      font-size: 0.8rem;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
    }

    label span {
      color: var(--accent-color);
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--laser-red);
      cursor: pointer;
    }

    .status-card {
      background-color: #141414;
      border-left: 4px solid var(--laser-red);
      padding: 10px 12px;
      border-radius: 4px;
      font-size: 0.8rem;
      line-height: 1.35;
      margin-top: auto;
    }

    .status-card h3 {
      font-size: 0.85rem;
      margin-bottom: 4px;
      color: #fff;
    }

    .btn-laser {
      background-color: var(--laser-red);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-laser:hover {
      background-color: #ff6b81;
    }

    .btn-laser:active {
      transform: scale(0.98);
    }

    @media (max-width: 768px) {
      body {
        overflow: auto;
      }

      .main-container {
        flex-direction: column;
      }

      .controls {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>Simulador de Ajuste Focal e Espessura (MDF)</h1>
    <p class="description">
      Ajuste a altura da lente e a espessura do MDF. Veja como a cintura do feixe (waist) e a distância focal
      influenciam no perfil de corte.
    </p>
  </header>

  <div class="main-container">
    <div class="canvas-container" id="canvasHolder">
      <canvas id="simCanvas"></canvas>
    </div>

    <div class="controls">
      <div class="control-group">
        <label for="heightSlider">Posição do Bocal (Altura): <span id="heightValue">50 mm</span></label>
        <input type="range" id="heightSlider" min="20" max="90" value="50" step="0.5">
      </div>

      <div class="control-group">
        <label for="focalSlider">Distância Focal da Lente: <span id="focalValue">50.8 mm (2.0")</span></label>
        <input type="range" id="focalSlider" min="25.4" max="101.6" value="50.8" step="0.1">
      </div>

      <div class="control-group">
        <label for="mdfSlider">Espessura do MDF: <span id="mdfValue">3.0 mm</span></label>
        <input type="range" id="mdfSlider" min="1" max="15" value="3" step="0.5">
      </div>

      <div class="control-group">
        <label for="powerSlider">Potência do Laser: <span id="powerValue">80%</span></label>
        <input type="range" id="powerSlider" min="20" max="100" value="80" step="5">
      </div>

      <button class="btn-laser" id="pulseBtn">Simular Disparo / Corte</button>

      <div class="status-card">
        <h3 id="statusTitle">Diagnóstico do Corte</h3>
        <p id="statusDesc">Analise os parâmetros para ver a eficiência do corte.</p>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    const canvasHolder = document.getElementById('canvasHolder');

    // UI Elements
    const heightSlider = document.getElementById('heightSlider');
    const heightValue = document.getElementById('heightValue');
    const focalSlider = document.getElementById('focalSlider');
    const focalValue = document.getElementById('focalValue');
    const mdfSlider = document.getElementById('mdfSlider');
    const mdfValue = document.getElementById('mdfValue');
    const powerSlider = document.getElementById('powerSlider');
    const powerValue = document.getElementById('powerValue');
    const pulseBtn = document.getElementById('pulseBtn');

    const statusTitle = document.getElementById('statusTitle');
    const statusDesc = document.getElementById('statusDesc');

    // Estado e Parâmetros (em mm)
    let nozzleHeight_mm = parseFloat(heightSlider.value);
    let focalLength_mm = parseFloat(focalSlider.value);
    let mdfThickness_mm = parseFloat(mdfSlider.value);
    let power = parseInt(powerSlider.value);

    let isFiring = false;
    let cutProgress = 0;

    // Redimensiona o canvas para preencher a área disponível mantendo alta resolução
    function resizeCanvas() {
      canvas.width = canvasHolder.clientWidth;
      canvas.height = canvasHolder.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Event Listeners
    heightSlider.addEventListener('input', (e) => {
      nozzleHeight_mm = parseFloat(e.target.value);
      heightValue.textContent = `${nozzleHeight_mm.toFixed(1)} mm`;
      updateStatus();
    });

    focalSlider.addEventListener('input', (e) => {
      focalLength_mm = parseFloat(e.target.value);
      const inches = (focalLength_mm / 25.4).toFixed(1);
      focalValue.textContent = `${focalLength_mm.toFixed(1)} mm (${inches}")`;
      updateStatus();
    });

    mdfSlider.addEventListener('input', (e) => {
      mdfThickness_mm = parseFloat(e.target.value);
      mdfValue.textContent = `${mdfThickness_mm.toFixed(1)} mm`;
      updateStatus();
    });

    powerSlider.addEventListener('input', (e) => {
      power = parseInt(e.target.value);
      powerValue.textContent = `${power}%`;
    });

    pulseBtn.addEventListener('click', () => {
      isFiring = true;
      cutProgress = 0;
    });

    function updateStatus() {
      const mdfTopY_mm = 60; // referência virtual de topo
      const nozzleY_mm = mdfTopY_mm - nozzleHeight_mm;
      const focusY_mm = nozzleY_mm + focalLength_mm;
      const focusRelative_mm = focusY_mm - mdfTopY_mm;

      if (focusRelative_mm < -2) {
        statusTitle.textContent = "Foco Muito Alto (Fora da Peça)";
        statusTitle.style.color = "#ff4757";
        statusDesc.textContent = `O foco está ${Math.abs(focusRelative_mm).toFixed(1)} mm acima do topo. O feixe atinge o MDF desfocado, aumentando a queima lateral e reduzindo o poder de penetração.`;
      } else if (focusRelative_mm >= -2 && focusRelative_mm <= mdfThickness_mm + 1) {
        statusTitle.textContent = "Foco Otimizado";
        statusTitle.style.color = "#2ed573";
        statusDesc.textContent = `Ponto focal ajustado dentro da faixa ideal do MDF (${mdfThickness_mm} mm). Máxima concentração de energia no corte com borda limpa.`;
      } else {
        statusTitle.textContent = "Foco Muito Baixo (Abaixo da Peça)";
        statusTitle.style.color = "#ffa502";
        statusDesc.textContent = `O foco está ${(focusRelative_mm - mdfThickness_mm).toFixed(1)} mm abaixo da base. A entrada do feixe será larga, gerando conicidade na peça.`;
      }
    }

    function drawScene() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const centerX = canvas.width / 2;

      // Cálculo de Escala Dinâmica baseada na altura do Canvas
      const SCALE = Math.min(canvas.height / 120, 6); // pixels por mm

      // Posição vertical centralizada para o MDF
      const mdfTopY_mm = (canvas.height / SCALE) * 0.55;
      const mdfThickness = mdfThickness_mm * SCALE;
      const mdfTopY = mdfTopY_mm * SCALE;

      const nozzleY = (mdfTopY_mm - nozzleHeight_mm) * SCALE;
      const focalLength = focalLength_mm * SCALE;
      const focusY = nozzleY + focalLength;

      // 1. MDF (Peça)
      const mdfWidth = Math.min(canvas.width - 80, 500);
      ctx.fillStyle = '#c8965d';
      ctx.fillRect(centerX - mdfWidth / 2, mdfTopY, mdfWidth, mdfThickness);

      ctx.strokeStyle = '#8a5a2b';
      ctx.lineWidth = 2;
      ctx.strokeRect(centerX - mdfWidth / 2, mdfTopY, mdfWidth, mdfThickness);

      // Texto no MDF
      ctx.fillStyle = '#4a2e11';
      ctx.font = 'bold 12px sans-serif';
      ctx.fillText(`MDF ${mdfThickness_mm} mm`, centerX - mdfWidth / 2 + 15, mdfTopY + Math.min(mdfThickness - 4, 18));

      // 2. Desenho do Feixe Laser
      const initialBeamRadius = 6 * SCALE;
      const minBeamRadius = 0.15 * SCALE;
      const bottomY = canvas.height - 15;

      ctx.beginPath();
      ctx.moveTo(centerX - initialBeamRadius, nozzleY);
      ctx.lineTo(centerX + initialBeamRadius, nozzleY);

      // Cintura Focal
      ctx.lineTo(centerX + minBeamRadius, focusY);

      // Cone Inferior
      const distBelowFocus = (bottomY - focusY) / SCALE;
      const bottomRadius = minBeamRadius + (Math.abs(distBelowFocus) * 0.12 * SCALE);

      ctx.lineTo(centerX + bottomRadius, bottomY);
      ctx.lineTo(centerX - bottomRadius, bottomY);
      ctx.lineTo(centerX - minBeamRadius, focusY);
      ctx.closePath();

      const laserGradient = ctx.createLinearGradient(0, nozzleY, 0, bottomY);
      laserGradient.addColorStop(0, 'rgba(255, 0, 85, 0.45)');
      laserGradient.addColorStop(0.5, 'rgba(255, 60, 60, 0.8)');
      laserGradient.addColorStop(1, 'rgba(255, 0, 85, 0.15)');

      ctx.fillStyle = laserGradient;
      ctx.fill();

      // Linha Central Radiante
      ctx.beginPath();
      ctx.moveTo(centerX, nozzleY);
      ctx.lineTo(centerX, bottomY);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.5;
      ctx.shadowColor = '#ff0055';
      ctx.shadowBlur = 10;
      ctx.stroke();
      ctx.shadowBlur = 0;

      // Marcador de Ponto Focal
      ctx.strokeStyle = '#FFF';
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 3]);
      ctx.beginPath();
      ctx.moveTo(centerX - 50, focusY);
      ctx.lineTo(centerX + 50, focusY);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.fillStyle = '#FFF';
      ctx.font = '16px sans-serif';
      ctx.fillText(`Foco (${focalLength_mm} mm)`, centerX + 55, focusY + 4);

      // 3. Efeito de Corte no MDF
      if (isFiring) {
        cutProgress += 0.04;
        if (cutProgress > 1) cutProgress = 1;

        const distToMdfTop_mm = Math.abs((mdfTopY - focusY) / SCALE);
        const topRadius_mm = 0.15 + (distToMdfTop_mm * 0.08);

        const mdfCenterY_mm = mdfTopY_mm + (mdfThickness_mm / 2);
        const focusY_mm_real = focusY / SCALE;
        const distFromCenter = Math.abs(mdfCenterY_mm - focusY_mm_real);

        let efficiency = Math.max(0.15, 1 - (distFromCenter / (mdfThickness_mm * 2)));
        efficiency *= (power / 100);

        const maxPenetration_mm = mdfThickness_mm * efficiency * 1.6;
        const currentDepth_mm = Math.min(mdfThickness_mm, maxPenetration_mm * cutProgress);
        const currentDepth_px = currentDepth_mm * SCALE;

        const kerfTop_px = topRadius_mm * 2 * SCALE;

        const distToCutBottom_mm = Math.abs(((mdfTopY + currentDepth_px) - focusY) / SCALE);
        const bottomRadius_mm = 0.15 + (distToCutBottom_mm * 0.08);
        const kerfBottom_px = bottomRadius_mm * 2 * SCALE;

        ctx.fillStyle = '#140903';
        ctx.beginPath();
        ctx.moveTo(centerX - kerfTop_px / 2, mdfTopY);
        ctx.lineTo(centerX + kerfTop_px / 2, mdfTopY);
        ctx.lineTo(centerX + kerfBottom_px / 2, mdfTopY + currentDepth_px);
        ctx.lineTo(centerX - kerfBottom_px / 2, mdfTopY + currentDepth_px);
        ctx.closePath();
        ctx.fill();

        if (cutProgress < 1 || currentDepth_mm < mdfThickness_mm) {
          ctx.fillStyle = '#ffda79';
          ctx.beginPath();
          ctx.arc(centerX + (Math.random() * 4 - 2), mdfTopY + currentDepth_px, Math.random() * 4 + 2, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // 4. Desenho do Bocal (Nozzle)
      ctx.fillStyle = '#333';
      ctx.fillRect(centerX - 35, nozzleY - 35, 70, 25);

      ctx.beginPath();
      ctx.moveTo(centerX - 25, nozzleY - 10);
      ctx.lineTo(centerX + 25, nozzleY - 10);
      ctx.lineTo(centerX + 6, nozzleY);
      ctx.lineTo(centerX - 6, nozzleY);
      ctx.closePath();
      ctx.fillStyle = '#555';
      ctx.fill();

      // Cotas de altura (Bocal x MDF)
      ctx.strokeStyle = '#666';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(centerX - (mdfWidth / 2 - 20), nozzleY);
      ctx.lineTo(centerX - (mdfWidth / 2 - 20), mdfTopY);
      ctx.stroke();

      ctx.fillStyle = '#aaa';
      ctx.font = '11px sans-serif';
      ctx.fillText(`${nozzleHeight_mm.toFixed(1)} mm`, centerX - (mdfWidth / 2 - 15), nozzleY + (mdfTopY - nozzleY) / 2);

      requestAnimationFrame(drawScene);
    }

    updateStatus();
    drawScene();
  </script>
</body>

</html>
